name: CD Pipeline

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy-staging:
    # Trigger only if CI succeeded, or if manually triggered
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # Deployment Strategy:
      # Currently connecting via SSH to target instance, authenticating with ECR,
      # pulling the newly built 'latest' images, and restarting docker compose.
      # Future enhancement: Replace this with AWS EKS deployment via kubectl applying manifests.
      - name: Deploy to Staging
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            export PATH=$PATH:/usr/local/bin
            aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | docker login --username AWS --password-stdin ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com
            cd /opt/fashionshop
            docker compose pull || docker-compose pull
            docker compose up -d || docker-compose up -d

      - name: Post-deploy Staging Smoke Test
        run: |
          sleep 15
          # Curl health endpoint to ensure application is running
          curl -f http://${{ secrets.DEPLOY_HOST }}/health || exit 1

  deploy-production:
    needs: deploy-staging
    # Using 'production' environment allows adding manual approval gates in GitHub settings
    environment: production
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Deployment Strategy:
      # Deploys identically to staging but awaits environment protection rules (manual approval).
      - name: Deploy to Production
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            export PATH=$PATH:/usr/local/bin
            aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | docker login --username AWS --password-stdin ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com
            cd /opt/fashionshop-prod
            docker compose pull || docker-compose pull
            docker compose up -d || docker-compose up -d

      - name: Post-deploy Production Smoke Test
        run: |
          sleep 15
          # Curl health endpoint to ensure application is running
          curl -f http://${{ secrets.DEPLOY_HOST }}/health || exit 1
