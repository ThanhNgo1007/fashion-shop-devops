# Local Development Docker Compose Configuration
# This file sets up the local development environment including frontend, API, MongoDB, and Nginx proxy.

services:
  # MongoDB Database Service
  mongo:
    image: mongo:7
    container_name: fashionshop-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - fashion-network
    restart: unless-stopped
    healthcheck:
      test: mongosh --eval 'db.runCommand("ping").ok' localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  # Backend API Service (Express 5)
  api:
    build:
      context: ./backend
    container_name: fashionshop-api
    ports:
      - "3001:3001"
    env_file:
      - .env.backend
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - fashion-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Frontend Service (React 19)
  frontend:
    build:
      context: ./frontend
      args:
        REACT_APP_API_KEY: http://localhost:3001/api
        REACT_APP_API_URL: http://localhost:3001
        REACT_APP_ADMIN_MAIL: ${ADMIN_MAIL:-admin@example.com}
    container_name: fashionshop-frontend
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - fashion-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Nginx Reverse Proxy
  proxy:
    image: nginx:1.27-alpine
    container_name: fashionshop-proxy
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - api
    networks:
      - fashion-network
    restart: unless-stopped

networks:
  fashion-network:
    driver: bridge
    name: fashion-network

volumes:
  mongo-data:
    name: fashion-mongo-data
