# Production Override Configuration
# This file is used alongside docker-compose.yml for production deployments.
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  # In production, we use MongoDB Atlas, so we disable the local mongo service
  mongo:
    profiles: ["disabled"]

  api:
    ports: [] # Remove port mapping for internal service
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    ports: [] # Remove port mapping for internal service
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
        reservations:
          cpus: '0.10'
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  proxy:
    ports:
      - "80:80"
      - "443:443"
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
