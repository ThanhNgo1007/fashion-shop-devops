services:
  frontend:
    image: nginx:1.27-alpine
    volumes:
      - ./test-fixtures/frontend/index.html:/usr/share/nginx/html/index.html:ro

  api:
    image: nginx:1.27-alpine
    volumes:
      - ./test-fixtures/api/default.conf:/etc/nginx/conf.d/default.conf:ro

  proxy:
    image: nginx:1.27-alpine
    depends_on:
      - frontend
      - api
    ports:
      - "${PROXY_PORT:-18080}:80"
    volumes:
      - ./default.conf:/etc/nginx/conf.d/default.conf:ro
