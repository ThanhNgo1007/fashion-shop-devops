server {
    listen 80;
    server_name _;

    location = /api/health {
        default_type text/plain;
        return 200 "api-ok\n";
    }

    location /socket.io/ {
        default_type text/plain;
        add_header X-Mock-Upgrade $http_upgrade always;
        return 200 "socket-ok\n";
    }

    location / {
        return 404;
    }
}
